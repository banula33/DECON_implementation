[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decon-implementation"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy", "Pillow"]

[project.optional-dependencies]
test = ["pytest", "scipy"]
official = ["smplx", "scipy", "PyYAML"]

[project.scripts]
decon-decouple = "decon.cli:main"

[tool.setuptools.packages.find]
include = ["decon*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
